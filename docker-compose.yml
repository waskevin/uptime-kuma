version: "3.8"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10074:3001"
    volumes:
      - "./data:/app/data"
    environment:
      - TZ=Asia/Shanghai
      - UPTIME_KUMA_PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

x-app-meta:
  web:
    port: 10074
    protocol: http
